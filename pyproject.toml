[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codevigrah"
dynamic = ["version"]
description = "Understand any repository like its author: guided tour, architecture, hotspots, change planner and AI chat."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "CodeVigrah contributors" }]
keywords = ["code comprehension", "onboarding", "static analysis", "architecture", "developer tools", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
# The core has no dependencies on purpose: it runs on a Raspberry Pi with nothing but Python and git.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.15"]  # only needed for the Anthropic API provider
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
codevigrah = "codevigrah.cli:main"

[project.urls]
Homepage = "https://github.com/samarthpusalkar/CodeVigrah"
Issues = "https://github.com/samarthpusalkar/CodeVigrah/issues"
Changelog = "https://github.com/samarthpusalkar/CodeVigrah/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "codevigrah.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codevigrah = ["web/static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501", # long lines: the formatter wraps code; long strings and regexes stay readable on one line
    "E741", # `l` as a loop variable is used throughout the analyzer
]

[tool.ruff.lint.isort]
known-first-party = ["codevigrah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
