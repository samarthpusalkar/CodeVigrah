name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository you analysed (if public)
      placeholder: https://github.com/owner/repo
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Analyse ...\n2. Open the ... view\n3. ..."
  - type: input
    id: env
    attributes:
      label: CodeVigrah version, OS, Python version, AI provider
      placeholder: "0.1.0, Raspberry Pi OS, Python 3.13, Claude Code"
  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console output
      render: text
